# =====================================================================================
# Configuração da API (valores padrão de DESENVOLVIMENTO).
#
# Cada valor pode ser trocado por variável de ambiente (${VARIAVEL:padrão}) ou, para a máquina
# local, por um arquivo FORA do git: application-local.properties (veja o .example ao lado).
# Prioridade (da maior para a menor): variáveis APP_*/SPRING_* do sistema > application-local.properties
# > este arquivo. NUNCA coloque segredos reais neste arquivo (ele vai para o git).
# =====================================================================================

server.port=${PORT:8080}

spring.application.name=vila-gourmet-api

# Credenciais e ajustes da máquina local (opcional; ignorado pelo git). O arquivo é procurado na pasta
# de trabalho da execução: backend/ (mvn, IDE com a pasta backend) ou a raiz do projeto.
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties

# --- Banco de dados (MySQL do docker-compose do projeto, porta 3307) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/pizzaria?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:pizzaria}
spring.datasource.password=${DB_PASSWORD:pizzaria}

spring.jpa.open-in-view=false
# o esquema é gerenciado exclusivamente pelo Flyway
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.default-property-inclusion=non_null

# --- Autenticação (JWT) ---
# OBRIGATÓRIO trocar em produção (mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:troque-este-segredo-em-producao-0123456789abcdef}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}
# validade do preço garantido na sessão de montagem
app.jwt.cotacao-minutos=${COTACAO_MINUTOS:30}

# --- CORS (origens do frontend, separadas por vírgula) ---
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}

# --- Códigos de acompanhamento / confirmação ---
app.codigos.confirmacao-validade-horas=48
app.codigos.confirmacao-max-tentativas=5

# --- Consulta de CEP (ViaCEP, sem chave) ---
app.cep.base-url=${CEP_BASE_URL:https://viacep.com.br/ws}

# --- Cidades e bairros da área de entrega ---
# Municípios: API de localidades do IBGE. Bairros: OpenStreetMap (Overpass); lista de servidores tentados em ordem.
app.ibge.base-url=${IBGE_BASE_URL:https://servicodados.ibge.gov.br/api/v1/localidades}
app.bairros.overpass-urls=${OVERPASS_URLS:https://overpass-api.de/api/interpreter,https://overpass.kumi.systems/api/interpreter}
app.bairros.timeout-segundos=90

# --- Imagens (Cloudinary) ---
# Informe app.cloudinary.url (cloudinary://chave:segredo@nome-da-conta) OU cloud-name + api-key + api-secret.
# Coloque as credenciais reais no application-local.properties (fora do git) ou em variáveis de ambiente.
app.cloudinary.url=${CLOUDINARY_URL:}
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.base-url=${CLOUDINARY_BASE_URL:https://api.cloudinary.com}
app.cloudinary.folder=${CLOUDINARY_FOLDER:vila-gourmet}
# 5 MB (imagem já decodificada)
app.cloudinary.max-bytes=5242880

# --- Limite de tentativas (rastreamento, mesa e login) ---
app.rate-limit.max-tentativas=10
app.rate-limit.janela-minutos=15
